name: CI

on:
  push:
    branches:
      - main
      - polo-li-citrix-nebuladesk-rust-rearchitecture
      - polo-li-citrix-windows-media-backend
      - polo-li-citrix-linux-media-backend
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  management-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  # Platform-specific lints also run in the native desktop matrix below.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-media
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  # The manager owns every placement and authorisation decision, and its tests
  # are the ones that need a database, so they run on their own.
  manager:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebula_signup_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      NEBULA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nebula_signup_ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-media
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-media
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p nebula-agent -p nebula-client -p nebula-desktop --all-targets
      # Desktop/GPU probes remain ignored; these tests need neither a display
      # nor the production manager database.
      - run: cargo test --locked -p nebula-agent -p nebula-client -p nebula-desktop -p nebula-desktop-protocol --lib --test stream_stability --test desktop_ipc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/desktop-ui
      - if: runner.os == 'Linux'
        name: Install management WebView dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: node scripts/desktop-sidecars.mjs --debug
      - run: cargo check --locked -p nebula-desktop --features gui,custom-protocol

  # The transport is where platform differences actually bite: UDP behaviour,
  # socket options and timer resolution all differ.
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ndp-transport -p ndp-proto -p ndp-crypto -p ndp-signal -p nebula-relay
