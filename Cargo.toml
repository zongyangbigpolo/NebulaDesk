[workspace]
resolver = "2"
members = [
    "crates/nebula-common",
    "crates/ndp-proto",
    "crates/ndp-crypto",
    "crates/ndp-transport",
    "crates/nebula-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/zongyangbigpolo/NebulaDesk"

[workspace.dependencies]
# --- internal ---
nebula-common = { path = "crates/nebula-common" }
ndp-proto = { path = "crates/ndp-proto" }
ndp-crypto = { path = "crates/ndp-crypto" }
ndp-transport = { path = "crates/ndp-transport" }
nebula-media-core = { path = "crates/nebula-media-core" }
nebula-media-macos = { path = "crates/nebula-media-macos" }
nebula-render = { path = "crates/nebula-render" }

# --- async runtime ---
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# --- transport ---
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pemfile = "2"
rcgen = "0.13"

# --- crypto ---
snow = { version = "0.9", features = ["risky-raw-split"] }
chacha20poly1305 = "0.10"
blake3 = "1.5"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
zeroize = "1.8"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- cli / config ---
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# --- time ---
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }

# --- control plane ---
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }
jsonwebtoken = "9"
http = "1"

# --- testing ---
tokio-test = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Media hot paths must not be crippled in dev builds.
[profile.dev.package."*"]
opt-level = 2
