[package]
name = "nebula-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NebulaDesk server machine agent: enrols a machine, holds a control tunnel, and serves sessions."

[dependencies]
nebula-common = { workspace = true }
ndp-crypto = { workspace = true }
ndp-proto = { workspace = true }
ndp-signal = { workspace = true }
ndp-transport = { workspace = true }

quinn = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
opus = { workspace = true }
arboard = { workspace = true }
png = { workspace = true }
blake3 = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[[bin]]
name = "nebula-agent"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
screencapturekit = "9"
shiguredo_video_toolbox = "2026.1"

[dev-dependencies]
tempfile = "3"
nebula-manager = { workspace = true }
nebula-gateway = { workspace = true }
nebula-relay = { workspace = true }
axum = { workspace = true }
