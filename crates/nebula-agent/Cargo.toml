[package]
name = "nebula-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NebulaDesk server machine agent: enrols a machine, holds a control tunnel, and serves sessions."

[dependencies]
nebula-common = { workspace = true }
ndp-crypto = { workspace = true }
ndp-proto = { workspace = true }
ndp-signal = { workspace = true }
ndp-transport = { workspace = true }

quinn = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
opus = { workspace = true }
arboard = { workspace = true }
png = { workspace = true }
blake3 = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[[bin]]
name = "nebula-agent"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
screencapturekit = "9"
shiguredo_video_toolbox = "2026.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
    "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
nebula-manager = { workspace = true }
nebula-gateway = { workspace = true }
nebula-relay = { workspace = true }
axum = { workspace = true }
