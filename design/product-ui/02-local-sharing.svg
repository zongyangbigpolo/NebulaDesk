<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <title>NebulaDesk · 本机共享</title>
  <desc>产品界面设计稿：独立于客户端连接的后台被控服务、桌面授权和应用发布。</desc>
  <g font-family="Inter, SF Pro Display, PingFang SC, Microsoft YaHei, sans-serif" fill="#202C39">
    <rect width="1280" height="820" rx="16" fill="#F8F9FB"/><path d="M16 0H224V820H16Q0 820 0 804V16Q0 0 16 0" fill="#EEF1F4"/><path d="M224 0V820" stroke="#DFE4EA"/>
    <circle cx="24" cy="24" r="6" fill="#FA6A61"/><circle cx="44" cy="24" r="6" fill="#F4BD4F"/><circle cx="64" cy="24" r="6" fill="#62C553"/>
    <rect x="22" y="67" width="32" height="32" rx="9" fill="#244D75"/><path d="M30 89V77L46 89V77" fill="none" stroke="white" stroke-width="2.5"/><text x="65" y="89" font-size="18" font-weight="650">NebulaDesk</text>
    <text x="24" y="137" font-size="11" fill="#7A8591" letter-spacing="1.5">工作空间</text>
    <g fill="none" stroke="#6D7987" stroke-width="1.7"><rect x="26" y="166" width="6" height="6" rx="1"/><rect x="36" y="166" width="6" height="6" rx="1"/><rect x="26" y="176" width="6" height="6" rx="1"/><rect x="36" y="176" width="6" height="6" rx="1"/></g><text x="55" y="180" font-size="14" fill="#536170">我的资源</text>
    <rect x="12" y="201" width="200" height="42" rx="8" fill="#DEE7F0"/><rect x="26" y="213" width="16" height="12" rx="2" fill="none" stroke="#244D75" stroke-width="1.6"/><path d="M34 225V230M29 230H39" stroke="#244D75" stroke-width="1.6"/><text x="55" y="226" font-size="14" fill="#244D75" font-weight="600">本机共享</text>
    <path d="M27 264H42M38 260L42 264L38 268M42 274H27M31 270L27 274L31 278" fill="none" stroke="#6D7987" stroke-width="1.6"/><text x="55" y="274" font-size="14" fill="#536170">文件传输</text><path d="M24 309H200" stroke="#DCE2E8"/>
    <text x="24" y="344" font-size="11" fill="#7A8591" letter-spacing="1.5">当前会话</text><circle cx="31" cy="376" r="3.5" fill="#348665"/><text x="44" y="381" font-size="13">办公室 Mac</text>
    <rect x="12" y="677" width="200" height="58" rx="9" fill="#E4E9EE"/><circle cx="32" cy="699" r="3" fill="#348665"/><text x="44" y="704" font-size="12" fill="#536170">已连接工作空间</text><text x="44" y="721" font-size="11" fill="#7A8591">个人空间</text><path d="M16 751H208" stroke="#DCE2E8"/><circle cx="35" cy="782" r="15" fill="#D6DFE8"/><text x="35" y="787" text-anchor="middle" font-size="12" fill="#456079">PL</text><text x="60" y="780" font-size="13" font-weight="600">Polo</text><text x="60" y="798" font-size="11" fill="#7A8591">账号与设置</text>
    <text x="260" y="32" font-size="12" fill="#83909D">个人空间</text><path d="M224 56H1280" stroke="#E5E9EE"/>
    <text x="264" y="112" font-size="28" font-weight="650" letter-spacing="-.8">本机共享</text><text x="264" y="140" font-size="14" fill="#788492">决定谁能连接这台电脑，以及他们能使用什么。</text>
    <g id="host-status"><rect x="264" y="170" width="972" height="111" rx="11" fill="white" stroke="#DFE6EC"/><rect x="286" y="193" width="60" height="60" rx="12" fill="#ECF1F5"/><rect x="298" y="207" width="36" height="25" rx="3" fill="none" stroke="#59788F" stroke-width="1.7"/><path d="M316 232V240M306 240H326" stroke="#59788F" stroke-width="1.7"/><text x="365" y="211" font-size="18" font-weight="600">Polo 的 MacBook Pro</text><text x="365" y="235" font-size="12" fill="#7C8894">macOS 26 · Apple M4 Pro</text><circle cx="369" cy="255" r="3" fill="#348665"/><text x="380" y="259" font-size="12" fill="#527965">后台服务运行中</text><text x="1048" y="211" font-size="13">允许远程连接</text><rect x="1171" y="192" width="43" height="25" rx="12.5" fill="#3C765D"/><circle cx="1201" cy="204.5" r="9.5" fill="white"/><text x="1214" y="245" text-anchor="end" font-size="11" fill="#8A959F">关闭主窗口后仍可连接</text></g>
    <g id="sharing-tabs"><text x="265" y="321" font-size="14" fill="#244D75" font-weight="600">共享内容</text><text x="378" y="321" font-size="14" fill="#85909B">访问记录</text><text x="491" y="321" font-size="14" fill="#85909B">连接设置</text><path d="M264 337H1236" stroke="#E2E7ED"/><path d="M264 337H320" stroke="#244D75" stroke-width="2"/></g>
    <g id="desktop-share"><text x="264" y="377" font-size="16" font-weight="600">完整桌面</text><text x="264" y="401" font-size="12" fill="#7C8894">对方可以看到桌面，并使用已允许的功能。</text><rect x="1110" y="360" width="126" height="34" rx="7" fill="white" stroke="#D8E0E7"/><text x="1173" y="382" text-anchor="middle" font-size="12" fill="#355B7D">管理访问权限</text><rect x="264" y="420" width="972" height="75" rx="9" fill="white" stroke="#DFE6EC"/><circle cx="296" cy="457" r="15" fill="#E5ECF3"/><text x="296" y="462" text-anchor="middle" font-size="11" fill="#56728A">PL</text><text x="323" y="450" font-size="13" font-weight="550">仅自己</text><text x="323" y="472" font-size="12" fill="#82909C">你可以从其他设备登录并连接</text><rect x="1045" y="444" width="81" height="25" rx="5" fill="#EFF4F0"/><text x="1085" y="461" text-anchor="middle" font-size="11" fill="#547660">完整控制</text><text x="1214" y="462" text-anchor="end" font-size="12" fill="#7F8B96">修改</text></g>
    <g id="published-apps"><text x="264" y="539" font-size="16" font-weight="600">共享应用</text><text x="264" y="563" font-size="12" fill="#7C8894">只开放指定应用，不向对方展示整个桌面。</text><rect x="1123" y="522" width="113" height="34" rx="7" fill="#244D75"/><text x="1179" y="544" text-anchor="middle" font-size="12" fill="white">＋ 添加应用</text><rect x="264" y="583" width="972" height="112" rx="9" fill="white" stroke="#DFE6EC"/><path d="M264 639H1236" stroke="#EAEFF3"/><rect x="284" y="597" width="28" height="28" rx="7" fill="#132944"/><text x="298" y="616" text-anchor="middle" font-size="13" fill="#8CBFFF">Ps</text><text x="326" y="616" font-size="13">Photoshop</text><text x="667" y="616" font-size="12" fill="#82909C">林辰、陈一</text><circle cx="1050" cy="611" r="3" fill="#348665"/><text x="1062" y="616" font-size="12" fill="#75818D">已发布</text><text x="1214" y="616" text-anchor="end" font-size="12" fill="#355B7D">管理</text><rect x="284" y="653" width="28" height="28" rx="7" fill="#F1EAE5"/><text x="298" y="672" text-anchor="middle" font-size="13" fill="#9B714B">B</text><text x="326" y="672" font-size="13">Blender</text><text x="667" y="672" font-size="12" fill="#82909C">尚未添加用户</text><circle cx="1050" cy="667" r="3" fill="#A4ADB6"/><text x="1062" y="672" font-size="12" fill="#75818D">未发布</text><text x="1214" y="672" text-anchor="end" font-size="12" fill="#355B7D">继续设置</text></g>
    <g id="os-permissions"><rect x="264" y="721" width="972" height="55" rx="8" fill="#EEF3F0"/><path d="M283 749L287 753L295 743" stroke="#548069" stroke-width="1.7" fill="none"/><text x="310" y="753" font-size="12" fill="#54715F">系统权限已就绪</text><text x="492" y="753" font-size="12" fill="#7B8B80">屏幕录制、系统音频、辅助功能</text><text x="1215" y="753" text-anchor="end" font-size="12" fill="#54715F">查看权限</text></g>
  </g>
</svg>
