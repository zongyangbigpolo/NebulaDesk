    <g id="connection-help"><rect x="264" y="598" width="972" height="93" rx="9" fill="#EEF2F6"/><text x="286" y="628" font-size="13" font-weight="600" fill="#4B6175">连接不上？</text><text x="286" y="653" font-size="12" fill="#738494">确认远端电脑已开机、连接网络，并开启了 NebulaDesk 的远程连接。</text><text x="1214" y="653" text-anchor="end" font-size="12" fill="#355B7D">连接诊断 →</text></g>
    <path d="M264 729H1236" stroke="#E3E8ED"/><text x="264" y="762" font-size="12" fill="#9A6662">移除设备</text><text x="365" y="762" font-size="12" fill="#8C96A0">移除后，这台电脑需要重新加入你的账号。</text>
