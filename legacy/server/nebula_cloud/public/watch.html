<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Cloud — Watch</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/watch.css" />
  </head>
  <body>
    <main class="watch-shell">
      <header class="topbar panel">
        <div>
          <h1 id="watch-title">Connecting…</h1>
          <p id="watch-status">Requesting a session ticket…</p>
        </div>
        <div class="inline-actions">
          <a href="/dashboard" class="secondary button-like">Back to dashboard</a>
        </div>
      </header>

      <section class="panel video-panel">
        <video id="remote-video" autoplay playsinline></video>
        <p id="video-hint" class="video-hint">
          Click the video to capture your mouse and keyboard, then they are sent to the remote Mac.
          Press <kbd>Esc</kbd> to release capture.
        </p>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
    <script src="/assets/watch.js" defer></script>
  </body>
</html>
