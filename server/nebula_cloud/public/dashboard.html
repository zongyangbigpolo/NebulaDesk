<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Cloud Dashboard</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="topbar panel">
        <div>
          <h1>Nebula Cloud Dashboard</h1>
          <p id="whoami">Loading user…</p>
        </div>
        <div class="inline-actions">
          <button id="refresh-devices" type="button">Refresh devices</button>
          <button id="logout" type="button" class="secondary">Logout</button>
        </div>
      </header>

      <section class="panel-grid two-up">
        <section class="panel">
          <h2>Create device</h2>
          <form id="create-device-form" class="stacked-form">
            <label>Device name<input name="name" type="text" required /></label>
            <button type="submit">Create device</button>
          </form>
          <pre id="create-device-output" class="output"></pre>
        </section>

        <section class="panel">
          <h2>Redeem claim code</h2>
          <form id="redeem-claim-form" class="stacked-form">
            <label>Claim code<input name="claimCode" type="text" placeholder="NEB-ABCDE-FGHIJ" required /></label>
            <button type="submit">Redeem claim code</button>
          </form>
          <pre id="redeem-claim-output" class="output"></pre>
        </section>
      </section>

      <section class="panel">
        <h2>Your devices and shared devices</h2>
        <div id="device-list" class="device-list"></div>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
