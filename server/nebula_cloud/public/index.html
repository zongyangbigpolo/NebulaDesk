<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Cloud</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="hero-card">
        <h1>Nebula Cloud</h1>
        <p>
          Multi-tenant control plane for Nebula relay access. Own devices, share them with other users,
          mint short-lived session tickets, and hand only JWT session tokens to <code>nebula_session</code>.
        </p>
      </section>

      <section class="panel-grid two-up">
        <section class="panel">
          <h2>Register</h2>
          <form id="register-form" class="stacked-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Display name<input name="displayName" type="text" autocomplete="name" required /></label>
            <label>Password<input name="password" type="password" minlength="8" required /></label>
            <button type="submit">Create account</button>
          </form>
          <pre id="register-output" class="output"></pre>
        </section>

        <section class="panel">
          <h2>Login</h2>
          <form id="login-form" class="stacked-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" minlength="8" required /></label>
            <button type="submit">Sign in</button>
          </form>
          <pre id="login-output" class="output"></pre>
        </section>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
